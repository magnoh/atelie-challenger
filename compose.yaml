services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgres://auction:auction@db:5432/auction
      PORT: 3001
      APP_ORIGIN: http://localhost:3001
      # HTTP local precisa de cookies sem Secure. Em HTTPS, use production.
      NODE_ENV: development
      AUDIT_SECRET: ${AUDIT_SECRET:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-Verzel2026!}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
  app_data:
